# Visit https://github.com/lowlighter/metrics/blob/master/action.yml for full reference
name: Metrics
on:
  # Schedule updates (once at midnight)
  schedule: [{cron: "0 0 * * *"}]
  # Lines below let you run workflow manually and on each commit
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Header
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          # Note: To fetch organization-wide metrics without NaN errors, set a Personal Access Token (PAT)
          # with scopes: `read:org`, `read:user`, `repo` as repository secret `METRICS_TOKEN`.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          base: repositories
          plugin_followup: yes
          plugin_followup_archived: no
          user: keploy
